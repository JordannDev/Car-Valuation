[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valueapi-api"
version = "0.1.0"
description = "Flask API for the vehicle valuation application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "PyMySQL[rsa]>=1.1,<2",
    "python-dotenv>=1.1,<2",
    "scipy>=1.15,<2",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.17.3,<0.18"]
production = ["gunicorn>=23,<24"]

[tool.setuptools.packages.find]
include = ["app*"]
